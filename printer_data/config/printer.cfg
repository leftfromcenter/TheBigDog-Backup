[include mainsail.cfg]
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3E00440016504D5930313820-if00

[virtual_sdcard]
path: /home/jason/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[auto_speed]

# printer.cfg

[include timelapse.cfg]


[printer]
kinematics: cartesian
max_velocity: 160
max_accel: 3119
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 350
position_max: 350
homing_speed: 100

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 999999

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 350
position_max: 350
homing_speed: 100

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
position_min: -6.0
position_max: 400
#hoiming_speed: 10

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.99
stealthchop_threshold: 999999

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
gear_ratio: 3:1
rotation_distance: 24.395
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
#control: pid
#pid_Kp: 22.22
#pid_Ki: 1.08
#pid_Kd: 114
min_temp: 10
max_temp: 300

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650

[filament_switch_sensor RUNOUT]
pause_on_runout: True
runout_gcode:
insert_gcode:
event_delay: 3.0
pause_delay: 0.5
switch_pin: PC15

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
#pid_Kp: 690.34
#pid_Ki: 111.47
#pid_Kd: 1068.83
min_temp: 0
max_temp: 130

[safe_z_home]
home_xy_position: 180, 180
speed: 100
z_hop: 10                 # Move up 10mm
z_hop_speed: 5

#[probe]
#pin:  ^!PC2
#z_offset: 4 # Uncomment if starting fresh; Distance should be enough to keep the z-offset positive.
#speed: 5.0
# Offset for Hero Me 6
#x_offset: 48
#y_offset: -2
# From: https://raw.githubusercontent.com/VoronDesign/Voron-2/Voron2.4/firmware/klipper_configurations/SKR_1.4/Voron2_SKR_14_Config.cfg and https://www.reddit.com/r/klippers/comments/sk42tx/how_do_i_get_my_bltouch_to_probe_twice_at_each/
#samples: 2
#samples_result: median
#sample_retract_dist: 5.0
#samples_tolerance: 0.01
#samples_tolerance_retries: 3

[bltouch]
sensor_pin: ^PC14
control_pin: PA1
## Offset for Hero Me 6
x_offset: -47
y_offset: -19
#z_offset: 3
speed: 3.0
pin_up_touch_mode_reports_triggered: False
samples: 2
samples_result: median
sample_retract_dist: 5.0
samples_tolerance: 0.01
samples_tolerance_retries: 3

# Bed Leveling: https://www.klipper3d.org/Bed_Level.html#determining-thermal-expansion
[bed_mesh]
speed: 120
horizontal_move_z: 7
mesh_min: 10, 5
mesh_max:303,331
probe_count: 5,5
mesh_pps: 2,2
fade_start: 1
fade_end: 10

[screws_tilt_adjust]
screw1: 63, 52
screw1_name: front left screw
screw2: 345, 52
screw2_name: front right screw
screw3: 345, 317
screw3_name: rear right screw
screw4: 63, 317
screw4_name: rear left screw
horizontal_move_z: 10
speed: 250
screw_thread: CW-M4

[gcode_macro START_PRINT]
gcode:
    G28
    BED_MESH_PROFILE LOAD=default
    

[heater_fan heatbreak_cooling_fan]
pin: PC7

[heater_fan controller_fan]
pin: PB15

[fan]
pin: PC6

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3E00440016504D5930313820-if00

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

[gcode_arcs]
resolution: 1.0

